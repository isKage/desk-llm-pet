name: release

# 推送 v* tag 时自动构建 macOS / Windows 安装包并发布 GitHub Release。
# 需要重新构建时也可以在 Actions 页面手动触发，填入已有 tag（例如 v1.1.1）。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要构建并发布的 tag（需已存在），例如 v1.1.1'
        required: true

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            # tag 构建时 electron-builder 默认会尝试自动发布并要求 GH_TOKEN；
            # 这里只负责产出安装包，发布统一交给下面的 publish job
            command: npm run build:mac -- --publish never
            artifacts: |
              dist/*.dmg
          - os: windows-latest
            command: npm run build:win -- --publish never
            artifacts: |
              dist/*.exe
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: ${{ matrix.command }}
        env:
          # 不签名，避免 CI 上没有证书时构建失败（与 v1.1.0 一致）
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.os }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Download installers
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          ls -lh artifacts
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --clobber
          else
            gh release create "$TAG" artifacts/* \
              --title "DeskLLMPet $TAG" \
              --notes-file "RELEASE_${TAG}.md"
          fi
